name: 视频运镜分析任务

on:
  workflow_dispatch: # 支持手动点击按钮触发

jobs:
  run-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖包
        run: |
          pip install opencv-python-headless openai

      - name: 执行分析脚本
        env:
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
          ARK_ENDPOINT_ID: ${{ secrets.ARK_ENDPOINT_ID }}
        run: |
          python main.py

      - name: 保存分析报告
        uses: actions/upload-artifact@v4
        with:
          name: 分析报告与关键帧
          path: |
            report.md
            start.jpg
            end.jpg
